{% extends "base.html" %}
{% block title %}Add product · Fresh Mart{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('inventory.index') }}">Inventory</a> / Add product{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">CATALOG</p><h1>Add a product</h1><p class="muted">Enter the product details to add it to your store.</p></div></div>
<section class="panel form-panel"><form method="post" class="product-form">
  <label>Product name<input name="name" required maxlength="120" value="{{ request.form.get('name', '') }}" placeholder="e.g. Fuji apples"></label>
  <label>Category<input name="category" maxlength="80" value="{{ request.form.get('category', '') }}" placeholder="e.g. Produce"></label>
  <div class="form-row"><label>Unit price<div class="input-prefix"><span>₹</span><input type="number" name="price" required min="0" step="0.01" value="{{ request.form.get('price', '') }}" placeholder="0.00"></div></label><label>Opening stock<input type="number" name="stock" required min="0" step="1" value="{{ request.form.get('stock', '') }}" placeholder="0"></label></div>
  <div class="form-actions"><a class="button button-quiet" href="{{ url_for('inventory.index') }}">Cancel</a><button class="button button-primary" type="submit">Save product</button></div>
</form></section>
{% endblock %}
